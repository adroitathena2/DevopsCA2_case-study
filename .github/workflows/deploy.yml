name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  # lowercase base (GHCR rejects uppercase)
  IMAGE_BASE: adroitathena2/devops-ca2-case-study

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps + test tools
        run: |
          pip install -r services/netflix/requirements.txt \
                      -r services/capitalone/requirements.txt \
                      pytest bandit
      - name: Run service tests
        run: python -m pytest services/netflix/test_netflix.py services/capitalone/test_capitalone.py -v
      - name: Shift-left security scan (SAST)
        run: bandit -r services -s B101 -f txt

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (netflix)
        id: meta-netflix
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-netflix

      - name: Extract metadata (capitalone)
        id: meta-capitalone
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-capitalone

      - name: Build and push netflix image
        uses: docker/build-push-action@v5
        with:
          context: ./services/netflix
          file: ./services/netflix/Dockerfile
          push: true
          tags: ${{ steps.meta-netflix.outputs.tags }}
          labels: ${{ steps.meta-netflix.outputs.labels }}

      - name: Build and push capitalone image
        uses: docker/build-push-action@v5
        with:
          context: ./services/capitalone
          file: ./services/capitalone/Dockerfile
          push: true
          tags: ${{ steps.meta-capitalone.outputs.tags }}
          labels: ${{ steps.meta-capitalone.outputs.labels }}
