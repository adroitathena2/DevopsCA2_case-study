- hosts: appservers
  become: yes
  vars:
    app_user: appuser
    base_dir: /opt/devops-ca2
    netflix_dir: "{{ base_dir }}/netflix"
    capitalone_dir: "{{ base_dir }}/capitalone"
  tasks:
    - name: Install required packages
      apt:
        name:
          - docker.io
          - python3-pip
          - curl
        state: present
        update_cache: yes

    - name: Create app user
      user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: yes

    - name: Create service directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'
      loop:
        - "{{ netflix_dir }}"
        - "{{ capitalone_dir }}"

    # Netflix (Q1 microservices + chaos demo, port 5001)
    - name: Copy Netflix app files
      copy:
        src: "../services/netflix/{{ item }}"
        dest: "{{ netflix_dir }}/"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
      loop:
        - app.py
        - requirements.txt
        - Dockerfile

    - name: Build Netflix image
      community.docker.docker_image:
        name: netflix-demo
        tag: latest
        source: build
        build:
          path: "{{ netflix_dir }}"
        state: present

    - name: Run Netflix container
      community.docker.docker_container:
        name: netflix-demo
        image: netflix-demo:latest
        state: started
        restart_policy: always
        ports:
          - "5001:5000"

    # Capital One (Q2 DevSecOps demo, port 5002)
    - name: Copy Capital One app files
      copy:
        src: "../services/capitalone/{{ item }}"
        dest: "{{ capitalone_dir }}/"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
      loop:
        - app.py
        - requirements.txt
        - Dockerfile

    - name: Build Capital One image
      community.docker.docker_image:
        name: capitalone-demo
        tag: latest
        source: build
        build:
          path: "{{ capitalone_dir }}"
        state: present

    - name: Run Capital One container
      community.docker.docker_container:
        name: capitalone-demo
        image: capitalone-demo:latest
        state: started
        restart_policy: always
        ports:
          - "5002:5000"
