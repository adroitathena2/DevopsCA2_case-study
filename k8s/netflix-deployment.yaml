apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix-demo
  template:
    metadata:
      labels:
        app: netflix-demo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: netflix-demo
        image: ghcr.io/adroitathena2/devops-ca2-case-study-netflix:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: CHAOS_ENABLED
          value: "0"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
